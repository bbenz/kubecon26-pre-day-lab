# Nightly order-processing batch. It must run on the dedicated processing pool
# (nodeSelector + toleration) and on amd64 nodes (the image is amd64-only).
apiVersion: batch/v1
kind: Job
metadata:
  name: order-batch
  namespace: c3-processing
  labels:
    app: order-batch
    kubecon.lab/challenge: c3
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: order-batch
        kubecon.lab/challenge: c3
    spec:
      restartPolicy: Never
      nodeSelector:
        kubecon.lab/pool: processing
        kubernetes.io/arch: amd64
      tolerations:
        - key: kubecon.lab/pool
          operator: Equal
          value: processing
          effect: NoSchedule
      containers:
        - name: batch
          image: mcr.microsoft.com/azurelinux/base/python:3.12
          command: ["python3", "-u", "-c"]
          args:
            - |
              import hashlib, os, platform, sys, time
              node = os.environ.get("NODE_NAME", "unknown")
              arch = platform.machine()
              print(f"order-batch starting on node {node} (arch {arch})")
              if arch not in ("x86_64", "amd64"):
                  print("ERROR: this build of order-batch only supports amd64 nodes")
                  sys.exit(3)
              total = 2000
              digest = b""
              for i in range(1, total + 1):
                  digest = hashlib.sha256(digest + f"order-{i}".encode()).digest()
                  hashlib.pbkdf2_hmac("sha256", digest, b"batch", 2000)
                  if i % 500 == 0:
                      print(f"processed {i}/{total} orders")
              print(f"BATCH COMPLETE: processed {total} orders on node {node} (arch {arch}) checksum={digest.hex()[:16]}")
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["true"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["true"]
            periodSeconds: 10
