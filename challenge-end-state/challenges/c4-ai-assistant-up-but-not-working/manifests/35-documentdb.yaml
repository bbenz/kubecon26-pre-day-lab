apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: documentdb
  namespace: c4-assistant
  labels:
    app: documentdb
    kubecon.lab/challenge: c4
spec:
  serviceName: documentdb
  replicas: 1
  selector:
    matchLabels:
      app: documentdb
  template:
    metadata:
      labels:
        app: documentdb
        kubecon.lab/challenge: c4
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: documentdb
          image: ghcr.io/documentdb/documentdb/documentdb-local:pg17-0.112.0
          args: ["--username", "username", "--password", "password"]
          ports:
            - containerPort: 10260
              name: documentdb
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 10260
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 10260
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 10260
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: documentdb
  namespace: c4-assistant
  labels:
    kubecon.lab/challenge: c4
spec:
  type: ClusterIP
  selector:
    app: documentdb
  ports:
    - port: 10260
      targetPort: 10260
