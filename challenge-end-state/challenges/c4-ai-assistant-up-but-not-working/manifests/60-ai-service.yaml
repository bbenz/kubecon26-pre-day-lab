# The store's AI assistant (ai-service). It calls a Microsoft Foundry (Azure OpenAI)
# model deployment using Microsoft Entra workload identity - no API keys.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-service
  namespace: c4-assistant
  labels:
    kubecon.lab/challenge: c4
  annotations:
    azure.workload.identity/client-id: "__AI_SERVICE_CLIENT_ID__"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-service-configs
  namespace: c4-assistant
  labels:
    kubecon.lab/challenge: c4
  annotations:
    kubecon.lab/change-ticket: "CHG-1142 - store assistant moves to the new GPT model (platform replaces the GPT-4.1 deployment)"
data:
  USE_AZURE_OPENAI: "True"
  USE_AZURE_AD: "True"
  USE_LOCAL_LLM: "False"
  AZURE_OPENAI_ENDPOINT: "__AZURE_OPENAI_ENDPOINT__"
  # FIXED: the model deployment that exists in the Foundry account. The old
  # store-assistant-gpt41 deployment was removed when the platform moved the
  # assistant to the new model (CHG-1142).
  AZURE_OPENAI_DEPLOYMENT_NAME: "__AZURE_OPENAI_DEPLOYMENT__"
  AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: c4-assistant
  labels:
    app: ai-service
    kubecon.lab/challenge: c4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        kubecon.lab/challenge: c4
        azure.workload.identity/use: "true"
      annotations:
        # Changes with the configuration so applying the end state over the
        # begin state restarts the pods (the ConfigMap is read at start-up).
        kubecon.lab/config-revision: "CHG-1142-fix"
    spec:
      serviceAccountName: ai-service
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: ai-service
          image: ghcr.io/azure-samples/aks-store-demo/ai-service:2.2.0
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: ai-service-configs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            failureThreshold: 24
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 3
            failureThreshold: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            failureThreshold: 10
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: c4-assistant
  labels:
    kubecon.lab/challenge: c4
spec:
  type: ClusterIP
  selector:
    app: ai-service
  ports:
    - name: http
      port: 5001
      targetPort: 5001
