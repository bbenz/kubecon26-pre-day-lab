apiVersion: apps/v1
kind: Deployment
metadata:
  name: makeline-service
  namespace: c4-assistant
  labels:
    app: makeline-service
    kubecon.lab/challenge: c4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: makeline-service
  template:
    metadata:
      labels:
        app: makeline-service
        kubecon.lab/challenge: c4
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: makeline-service
          image: ghcr.io/azure-samples/aks-store-demo/makeline-service:2.2.0
          ports:
            - containerPort: 3001
          env:
            - name: ORDER_QUEUE_URI
              value: "amqp://rabbitmq:5672"
            - name: ORDER_QUEUE_USERNAME
              value: "username"
            - name: ORDER_QUEUE_PASSWORD
              value: "password"
            - name: ORDER_QUEUE_NAME
              value: "orders"
            - name: ORDER_DB_URI
              value: "mongodb://documentdb:10260/?tls=true&tlsAllowInvalidCertificates=true"
            - name: ORDER_DB_NAME
              value: "orderdb"
            - name: ORDER_DB_COLLECTION_NAME
              value: "orders"
            - name: ORDER_DB_USERNAME
              value: "username"
            - name: ORDER_DB_PASSWORD
              value: "password"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /liveness
              port: 3001
            failureThreshold: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            failureThreshold: 3
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /liveness
              port: 3001
            failureThreshold: 5
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: makeline-service
  namespace: c4-assistant
  labels:
    kubecon.lab/challenge: c4
spec:
  type: ClusterIP
  selector:
    app: makeline-service
  ports:
    - name: http
      port: 3001
      targetPort: 3001
