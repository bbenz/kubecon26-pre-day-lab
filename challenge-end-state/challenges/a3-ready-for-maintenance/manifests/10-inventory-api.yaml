# inventory-api - availability requirement: at least ONE replica must keep
# serving requests at all times, including during planned maintenance.
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-api-script
  namespace: a3-maintenance
  labels:
    kubecon.lab/challenge: a3
data:
  api.py: |
    import json, os
    from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler

    POD = os.environ.get("HOSTNAME", "unknown")

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_GET(self):
            payload = {"status": "ok"} if self.path == "/healthz" else {"service": "inventory-api", "pod": POD, "items": 128}
            body = json.dumps(payload).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            pass

    print(f"inventory-api {POD} listening on :8080", flush=True)
    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: a3-maintenance
  labels:
    app: inventory-api
    kubecon.lab/challenge: a3
spec:
  # FIXED: with a single replica, a PDB of minAvailable=1 allows zero voluntary
  # disruptions. Two ready replicas keep one serving while the other is evicted.
  replicas: 2
  selector:
    matchLabels:
      app: inventory-api
  template:
    metadata:
      labels:
        app: inventory-api
        kubecon.lab/challenge: a3
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: inventory-api
      containers:
        - name: api
          image: mcr.microsoft.com/azurelinux/base/python:3.12
          command: ["python3", "-u", "/app/api.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
          lifecycle:
            preStop:
              exec:
                # Keep serving while the pod is removed from the Service endpoints.
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
      volumes:
        - name: script
          configMap:
            name: inventory-api-script
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-api
  namespace: a3-maintenance
  labels:
    kubecon.lab/challenge: a3
spec:
  selector:
    app: inventory-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
