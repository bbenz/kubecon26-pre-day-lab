# Shared by config-reader and report-generator. Every CHECK_INTERVAL_SECONDS it:
#   1. exchanges the pod's projected Kubernetes service-account token for a
#      Microsoft Entra token (workload identity federation), then
#   2. reads the lab configuration value from Azure Key Vault.
# It never logs tokens. Results: container logs and GET /status.
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-reader-script
  namespace: a4-config
  labels:
    kubecon.lab/challenge: a4
data:
  reader.py: |
    import json, os, threading, time, urllib.error, urllib.parse, urllib.request
    from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler

    APP = os.environ.get("APP_NAME", "config-reader")
    VAULT = os.environ.get("KEY_VAULT_URI", "").rstrip("/")
    SECRET = os.environ.get("SECRET_NAME", "lab-config")
    INTERVAL = int(os.environ.get("CHECK_INTERVAL_SECONDS", "20"))
    state = {"app": APP, "ok": False, "stage": "starting", "detail": "first check pending",
             "value": None, "checkedAt": None}


    class StageError(Exception):
        def __init__(self, stage, detail):
            super().__init__(detail)
            self.stage, self.detail = stage, detail


    def log(msg):
        print(f"[{time.strftime('%H:%M:%S')}] {msg}", flush=True)


    def entra_token():
        token_file = os.environ.get("AZURE_FEDERATED_TOKEN_FILE")
        if not token_file:
            raise StageError("workload-identity", "AZURE_FEDERATED_TOKEN_FILE is not set: the workload identity "
                             "webhook did not inject credentials (check the pod label azure.workload.identity/use "
                             "and the service account annotation azure.workload.identity/client-id)")
        with open(token_file) as f:
            assertion = f.read().strip()
        authority = os.environ.get("AZURE_AUTHORITY_HOST", "https://login.microsoftonline.com/").rstrip("/")
        url = f"{authority}/{os.environ['AZURE_TENANT_ID']}/oauth2/v2.0/token"
        form = urllib.parse.urlencode({
            "grant_type": "client_credentials",
            "client_id": os.environ["AZURE_CLIENT_ID"],
            "scope": "https://vault.azure.net/.default",
            "client_assertion_type": "urn:ietf:params:oauth:client-assertion-type:jwt-bearer",
            "client_assertion": assertion,
        }).encode()
        try:
            with urllib.request.urlopen(urllib.request.Request(url, data=form, method="POST"), timeout=15) as resp:
                return json.load(resp)["access_token"]
        except urllib.error.HTTPError as e:
            try:
                body = json.loads(e.read() or b"{}")
            except ValueError:
                body = {}
            desc = str(body.get("error_description", e)).split("Trace ID")[0].strip()
            raise StageError("token-exchange", f"{body.get('error', e.code)}: {desc}")


    def read_secret(token):
        req = urllib.request.Request(f"{VAULT}/secrets/{SECRET}?api-version=7.4",
                                     headers={"Authorization": f"Bearer {token}"})
        try:
            with urllib.request.urlopen(req, timeout=15) as resp:
                return json.load(resp)["value"]
        except urllib.error.HTTPError as e:
            try:
                err = json.loads(e.read() or b"{}").get("error", {})
            except ValueError:
                err = {}
            raise StageError("key-vault", f"HTTP {e.code} {err.get('code', '')}: {err.get('message', '')}".strip())


    def check():
        stamp = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
        try:
            value = read_secret(entra_token())
            state.update(ok=True, stage="done", detail=f"read secret '{SECRET}' from {VAULT}", value=value,
                         checkedAt=stamp)
            log(f"OK - read secret '{SECRET}' from Key Vault using workload identity")
        except StageError as e:
            state.update(ok=False, stage=e.stage, detail=e.detail, value=None, checkedAt=stamp)
            log(f"FAILED at stage '{e.stage}': {e.detail}")
        except Exception as e:  # network errors, missing env vars, ...
            state.update(ok=False, stage="error", detail=repr(e), value=None, checkedAt=stamp)
            log(f"FAILED: {e!r}")


    def loop():
        while True:
            check()
            time.sleep(INTERVAL)


    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_GET(self):
            payload = {"status": "ok"} if self.path == "/healthz" else state
            body = json.dumps(payload, indent=2).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            pass


    log(f"{APP} starting: reading secret '{SECRET}' from {VAULT} every {INTERVAL}s")
    threading.Thread(target=loop, daemon=True).start()
    ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
# The application that SHOULD be able to read the configuration value.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-reader
  namespace: a4-config
  labels:
    kubecon.lab/challenge: a4
  annotations:
    azure.workload.identity/client-id: "__CONFIG_READER_CLIENT_ID__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-reader
  namespace: a4-config
  labels:
    app: config-reader
    kubecon.lab/challenge: a4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-reader
  template:
    metadata:
      labels:
        app: config-reader
        kubecon.lab/challenge: a4
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: config-reader
      containers:
        - name: reader
          image: mcr.microsoft.com/azurelinux/base/python:3.12
          command: ["python3", "-u", "/app/reader.py"]
          env:
            - name: APP_NAME
              value: config-reader
            - name: KEY_VAULT_URI
              value: "__KEY_VAULT_URI__"
            - name: SECRET_NAME
              value: lab-config
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
      volumes:
        - name: script
          configMap:
            name: config-reader-script
---
apiVersion: v1
kind: Service
metadata:
  name: config-reader
  namespace: a4-config
  labels:
    kubecon.lab/challenge: a4
spec:
  selector:
    app: config-reader
  ports:
    - name: http
      port: 8080
      targetPort: 8080
