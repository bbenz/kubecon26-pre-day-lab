apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: c1-store
  labels:
    app: product-service
    kubecon.lab/challenge: c1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
        kubecon.lab/challenge: c1
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: product-service
          image: ghcr.io/azure-samples/aks-store-demo/product-service:2.2.0
          ports:
            - containerPort: 3002
          env:
            - name: AI_SERVICE_URL
              value: "http://ai-service:5001/"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            failureThreshold: 3
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            failureThreshold: 5
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: c1-store
  labels:
    kubecon.lab/challenge: c1
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - name: http
      port: 3002
      targetPort: 3002
