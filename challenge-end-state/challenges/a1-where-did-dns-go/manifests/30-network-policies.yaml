# Namespace network isolation (CHG-1150).
# 1) Deny all egress for every pod in the namespace by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: a1-inventory
  labels:
    kubecon.lab/challenge: a1
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# 2) inventory-sync may only call the catalog API - plus DNS, which it needs to
#    find the catalog API by name.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-sync-egress
  namespace: a1-inventory
  labels:
    kubecon.lab/challenge: a1
  annotations:
    kubecon.lab/change-ticket: "CHG-1150 - lock down inventory-sync egress to the catalog API only"
spec:
  podSelector:
    matchLabels:
      app: inventory-sync
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: catalog-api
      ports:
        - protocol: TCP
          port: 8080
    # FIXED: allow DNS (UDP and TCP 53).
    #  - AKS Automatic uses LocalDNS: pods send queries to a node-local listener
    #    (169.254.10.11, see /etc/resolv.conf), not to the CoreDNS pods.
    #  - With Azure CNI powered by Cilium (>= 1.17) that traffic counts as traffic
    #    to the node ("host" entity), which a Kubernetes NetworkPolicy cannot
    #    select: ipBlock 169.254.10.x and kube-dns pod selectors do not match it.
    #  - So the rule names the DNS ports without a destination. Everything else
    #    stays blocked (ledger-api, the internet). For DNS to the node only, use a
    #    CiliumNetworkPolicy with toEntities: [host] instead (see SOLUTION.md).
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
