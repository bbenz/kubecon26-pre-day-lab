# Store admin UI. Product editing has an "Ask AI Assistant" button that calls
# /api/ai/generate/description -> product-service -> ai-service -> Azure OpenAI.
# Open it with: kubectl port-forward -n c4-assistant svc/store-admin 8081:80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-admin
  namespace: c4-assistant
  labels:
    app: store-admin
    kubecon.lab/challenge: c4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-admin
  template:
    metadata:
      labels:
        app: store-admin
        kubecon.lab/challenge: c4
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: store-admin
          image: ghcr.io/azure-samples/aks-store-demo/store-admin:2.2.0
          ports:
            - containerPort: 8081
              name: store-admin
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8081
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            failureThreshold: 3
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            failureThreshold: 5
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: store-admin
  namespace: c4-assistant
  labels:
    kubecon.lab/challenge: c4
spec:
  type: ClusterIP
  selector:
    app: store-admin
  ports:
    - name: http
      port: 80
      targetPort: 8081
