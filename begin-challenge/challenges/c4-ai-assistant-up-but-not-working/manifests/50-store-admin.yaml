# Store admin UI. Product editing has an "Ask AI Assistant" button that calls
# /api/ai/generate/description -> product-service -> ai-service -> Azure OpenAI.
# Open it with: kubectl port-forward -n c4-assistant svc/store-admin 8081:80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-admin
  namespace: c4-assistant
  labels:
    app: store-admin
    kubecon.lab/challenge: c4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-admin
  template:
    metadata:
      labels:
        app: store-admin
        kubecon.lab/challenge: c4
      annotations:
        kubectl.kubernetes.io/default-container: store-admin
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      initContainers:
        # AKS Automatic nodes cache DNS answers (LocalDNS, serve-stale). Right after a
        # Service is re-created - for example by a challenge reset - the first lookup
        # on a node can still return the Service's previous address. nginx resolves its
        # upstreams only once, at startup, so look them up first: the first answer
        # refreshes the node cache and nginx then starts with the current addresses.
        - name: warm-dns-cache
          image: mcr.microsoft.com/azurelinux/busybox:1.36
          command:
            - sh
            - -c
            - for i in 1 2 3; do for h in makeline-service order-service product-service; do nslookup "$h.c4-assistant.svc.cluster.local" >/dev/null 2>&1; done; sleep 2; done
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: store-admin
          image: ghcr.io/azure-samples/aks-store-demo/store-admin:2.2.0
          ports:
            - containerPort: 8081
              name: store-admin
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8081
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            failureThreshold: 3
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            failureThreshold: 5
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: store-admin
  namespace: c4-assistant
  labels:
    kubecon.lab/challenge: c4
spec:
  type: ClusterIP
  selector:
    app: store-admin
  ports:
    - name: http
      port: 80
      targetPort: 8081
